[project]
name = "od-badge"
version = "0.1.0"
description = "Render and upload an ESPHome conference badge to an OpenDisplay e-paper tag"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "odl-renderer>=0.5.12",
    "py-opendisplay>=7.16.0",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "qrcode>=8.2",
    "aiohttp>=3.14.3",
]

[project.scripts]
od-badge = "od_badge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["od_badge"]

[tool.hatch.build.targets.wheel.force-include]
"od_badge/assets" = "od_badge/assets"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
